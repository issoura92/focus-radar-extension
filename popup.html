<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus Radar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wrap">
    <section class="hero glass">
      <div class="brand"><img src="icons/icon48.png" alt=""><div><h1>Focus Radar</h1><p>رادار ذكي لحماية وقتك</p></div></div>
      <label class="switch"><input id="enabled" type="checkbox"><span></span></label>
    </section>
    <section class="glass statsTop">
      <div><b id="totalTime">0د</b><span>استهلاك اليوم</span></div><div><b id="lockedCount">0</b><span>مواقع محظورة</span></div>
    </section>
    <section class="glass panel">
      <h2>إعدادات الحظر</h2>
      <div class="grid2"><label>الحد اليومي بالدقائق<input id="dailyLimit" type="number" min="1"></label><label>مدة الحظر بالدقائق<input id="blockMinutes" type="number" min="1"></label></div>
      <label>المواقع المشتتة — موقع في كل سطر<textarea id="sites" rows="5"></textarea></label>
      <button id="save" class="primary">حفظ الإعدادات</button>
    </section>
    <section class="glass panel"><div class="titleRow"><h2>استهلاك اليوم</h2><button id="reset">تصفير</button></div><div id="usageList" class="usage"></div></section>
    <section class="glass panel"><h2>آخر الأحداث</h2><div id="events" class="events"></div></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
